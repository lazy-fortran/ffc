name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + fpm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ffc
        uses: actions/checkout@v4
        with:
          path: ffc
          fetch-depth: 0

      - name: Read corpus pins
        id: corpus_pins
        working-directory: ffc
        run: scripts/fetch_corpora.sh --print-pins >> "$GITHUB_OUTPUT"

      - name: Restore LFortran corpus
        id: lfortran_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/lfortran
          key: corpus-v1-${{ runner.os }}-lfortran-${{ steps.corpus_pins.outputs.lfortran_sha }}

      - name: Restore gfortran.dg corpus
        id: gcc_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/gcc
          key: corpus-v1-${{ runner.os }}-gcc-gfortran-dg-${{ steps.corpus_pins.outputs.gcc_sha }}

      - name: Fetch and verify pinned corpora
        working-directory: ffc
        env:
          FFC_LFORTRAN_DIR: ${{ github.workspace }}/lfortran
          FFC_GFORTRAN_DG_DIR: ${{ github.workspace }}/gcc/gcc/testsuite/gfortran.dg
        run: scripts/fetch_corpora.sh

      - name: Test corpus verifier
        working-directory: ffc
        env:
          FFC_LFORTRAN_DIR: ${{ github.workspace }}/lfortran
        run: test/test_fetch_corpora.sh

      - name: Save LFortran corpus
        if: steps.lfortran_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/lfortran
          key: corpus-v1-${{ runner.os }}-lfortran-${{ steps.corpus_pins.outputs.lfortran_sha }}

      - name: Save gfortran.dg corpus
        if: steps.gcc_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/gcc
          key: corpus-v1-${{ runner.os }}-gcc-gfortran-dg-${{ steps.corpus_pins.outputs.gcc_sha }}

      - name: Checkout fortfront (sibling path)
        uses: actions/checkout@v4
        with:
          repository: lazy-fortran/fortfront
          path: fortfront

      - name: Checkout liric
        uses: actions/checkout@v4
        with:
          repository: krystophny/liric
          path: liric

      - name: Checkout fo
        uses: actions/checkout@v4
        with:
          repository: lazy-fortran/fo
          path: fo

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran-14 gcc-14 g++-14 cmake ninja-build curl
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          sudo update-alternatives --install /usr/bin/gfortran gfortran /usr/bin/gfortran-14 100
          gcc --version | head -1
          gfortran --version | head -1

      - name: Install fpm
        run: |
          sudo curl -L -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          sudo chmod +x /usr/local/bin/fpm
          fpm --version

      - name: Install fo onto PATH
        working-directory: fo
        run: |
          fpm install --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build liric
        working-directory: liric
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -la build/libliric.a

      - name: Build ffc
        working-directory: ffc
        env:
          LIBRARY_PATH: ${{ github.workspace }}/liric/build
        run: fpm build

      - name: Run ffc tests
        working-directory: ffc
        env:
          LIBRARY_PATH: ${{ github.workspace }}/liric/build
        run: fpm test

      - name: Run pinned corpus buckets
        working-directory: ffc
        env:
          LIBRARY_PATH: ${{ github.workspace }}/liric/build
          FFC_LFORTRAN_DIR: ${{ github.workspace }}/lfortran
          FFC_GFORTRAN_DG_DIR: ${{ github.workspace }}/gcc/gcc/testsuite/gfortran.dg
        run: |
          scripts/conformance_check.sh --no-build --suite lfortran \
            --files-from test/conformance/ci_lfortran.txt
          scripts/conformance_check.sh --no-build --suite gfortran-dg \
            --files-from test/conformance/ci_gfortran_dg.txt

      # Runs last, and after "Build ffc" for two reasons. The compiler half of
      # `fo lint` re-compiles each source with -fsyntax-only against the module
      # directories under build/, so without a prior build it silently reports
      # almost nothing; and putting it after the test and corpus steps keeps a
      # lint failure from cancelling their result.
      - name: Lint (fo)
        working-directory: ffc
        env:
          LIBRARY_PATH: ${{ github.workspace }}/liric/build
        run: |
          set -euo pipefail
          # `fo lint` exits 1 on any finding, so capture the report first and
          # decide below which half of it gates.
          fo lint --json > "$RUNNER_TEMP/fo-lint.json" || true
          jq -r '.warnings[] | "\(.file):\(.line):\(.column): \(.message)"' \
            "$RUNNER_TEMP/fo-lint.json"
          unused=$(jq '.unused_imports | length' "$RUNNER_TEMP/fo-lint.json")
          warnings=$(jq '.warnings | length' "$RUNNER_TEMP/fo-lint.json")
          echo "unused imports: $unused, compiler warnings: $warnings"
          # Blocking: main carries no unused imports, so a new one is a
          # regression and fails here.
          # Not blocking yet: the compiler warnings are pre-existing debt
          # (27 on main, tracked in issue #475). They are printed above. Once
          # they are cleared this whole step collapses into a plain `fo lint`,
          # whose exit status already covers both halves.
          test "$unused" -eq 0

  # `fo fmt --check` only reads sources: it needs neither fortfront, nor liric,
  # nor a build. Its own job therefore starts reporting within a minute or two,
  # and a formatting failure never pre-empts the build and test results.
  fmt:
    name: fo fmt --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ffc
        uses: actions/checkout@v4
        with:
          path: ffc
          fetch-depth: 0

      - name: Checkout fo
        uses: actions/checkout@v4
        with:
          repository: lazy-fortran/fo
          path: fo

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version | head -1

      - name: Install fpm
        run: |
          sudo curl -L -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          sudo chmod +x /usr/local/bin/fpm
          fpm --version

      - name: Install fo onto PATH
        working-directory: fo
        run: |
          fpm install --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Compare changed sources with the base revision. This prevents new
      # formatting regressions without making every feature PR inherit the
      # existing whole-tree formatter debt. *.inc fragments remain excluded.
      - name: Check changed-file formatting
        working-directory: ffc
        run: scripts/check_changed_format.sh
