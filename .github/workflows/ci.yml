name: CI

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full `fo test --all` run (about 8 minutes) and `fo lint` (20 to 45
  # minutes) run in nightly.yml; the merge queue builds ffc and runs the gates
  # and pinned corpus buckets below.
  build-test:
    name: build + fast gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ffc
        uses: actions/checkout@v4
        with:
          path: ffc
          fetch-depth: 0

      - name: Read corpus pins
        id: corpus_pins
        working-directory: ffc
        run: scripts/fetch_corpora.sh --print-pins >> "$GITHUB_OUTPUT"

      - name: Restore LFortran corpus
        id: lfortran_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/lfortran
          key: corpus-v1-${{ runner.os }}-lfortran-${{ steps.corpus_pins.outputs.lfortran_sha }}

      - name: Restore gfortran.dg corpus
        id: gcc_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/gcc
          key: corpus-v1-${{ runner.os }}-gcc-gfortran-dg-${{ steps.corpus_pins.outputs.gcc_sha }}

      - name: Fetch and verify pinned corpora
        working-directory: ffc
        env:
          FFC_LFORTRAN_DIR: ${{ github.workspace }}/lfortran
          FFC_GFORTRAN_DG_DIR: ${{ github.workspace }}/gcc/gcc/testsuite/gfortran.dg
        run: scripts/fetch_corpora.sh

      - name: Test corpus verifier
        working-directory: ffc
        env:
          FFC_LFORTRAN_DIR: ${{ github.workspace }}/lfortran
        run: test/test_fetch_corpora.sh

      - name: Save LFortran corpus
        if: steps.lfortran_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/lfortran
          key: corpus-v1-${{ runner.os }}-lfortran-${{ steps.corpus_pins.outputs.lfortran_sha }}

      - name: Save gfortran.dg corpus
        if: steps.gcc_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/gcc
          key: corpus-v1-${{ runner.os }}-gcc-gfortran-dg-${{ steps.corpus_pins.outputs.gcc_sha }}

      - uses: ./ffc/.github/actions/ffc-setup

      - name: Build ffc
        id: build_ffc
        working-directory: ffc
        env:
          LIBRARY_PATH: ${{ github.workspace }}/liric/build
          LIRIC_BUILD_DIR: ${{ github.workspace }}/liric/build
        run: fo build

      - name: No DT_TEXTREL gate
        if: ${{ always() && steps.build_ffc.outcome == 'success' }}
        working-directory: ffc
        run: test/test_no_textrel_link.sh

      - name: lowering_context_t field freeze
        if: ${{ always() && steps.build_ffc.outcome == 'success' }}
        working-directory: ffc
        run: scripts/check_lowering_context_freeze.sh

      - name: Behaviour parity gates
        if: ${{ always() && steps.build_ffc.outcome == 'success' }}
        working-directory: ffc
        env:
          LIBRARY_PATH: ${{ github.workspace }}/liric/build
        run: |
          # Each script compares ffc against gfortran on a specific defect or
          # pinned behaviour cluster. They were previously committed without CI
          # registration, which meant any of them could go red unnoticed.
          set -u
          status=0
          for gate in \
            test/test_default_unit_io_parity.sh \
            test/test_stdin_eof_parity.sh \
            test/test_pause_stdin_eof_parity.sh \
            test/test_use_only_operator_spelling.sh \
            test/test_elemental_explicit_interface_parity.sh \
            test/test_data_zero_fill_seen_growth.sh \
            test/test_procedure_pointer_dummies.sh \
            test/test_logical_array_parity.sh \
            test/test_assumed_shape_derived_runtime_parity.sh \
            test/test_print_scalar_result_call_parity.sh \
            test/test_select_rank_dispatch_parity.sh \
            test/test_character_runtime_len_parity.sh \
            test/test_logical_section_reduction_parity.sh \
            test/test_reduction_descriptor_extent_parity.sh \
            test/test_character_assumed_shape_dummy_parity.sh \
            test/test_character_fixed_result_assign_parity.sh
          do
            printf '::group::%s\n' "$gate"
            if bash "$gate"; then
              printf '::endgroup::\n'
            else
              printf '::endgroup::\n' >&2
              echo "GATE FAILED: $gate" >&2
              status=1
            fi
          done
          exit "$status"

      - name: Run pinned corpus buckets
        if: ${{ always() && steps.build_ffc.outcome == 'success' }}
        working-directory: ffc
        env:
          LIBRARY_PATH: ${{ github.workspace }}/liric/build
          LIRIC_BUILD_DIR: ${{ github.workspace }}/liric/build
          FFC_LFORTRAN_DIR: ${{ github.workspace }}/lfortran
          FFC_GFORTRAN_DG_DIR: ${{ github.workspace }}/gcc/gcc/testsuite/gfortran.dg
        run: |
          scripts/conformance_check.sh --no-build --suite lfortran \
            --files-from test/conformance/ci_lfortran.txt
          scripts/conformance_check.sh --no-build --suite gfortran-dg \
            --files-from test/conformance/ci_gfortran_dg.txt

  # `fo fmt --check` only reads sources: it needs neither fortfront, nor liric,
  # nor a build. Its own job therefore starts reporting within a minute or two,
  # and a formatting failure never pre-empts the build and test results.
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
  fmt:
    name: fo fmt --check
    runs-on: [self-hosted, itp-ubuntu24]
    steps:
      - name: Checkout ffc
        uses: actions/checkout@v4
        with:
          path: ffc
          fetch-depth: 0

      - name: Checkout fo
        uses: actions/checkout@v4
        with:
          repository: lazy-fortran/fo
          path: fo

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          gfortran --version | head -1

      - name: Install fpm
        run: |
          sudo curl -L -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          sudo chmod +x /usr/local/bin/fpm
          fpm --version

      - name: Install fo onto PATH
        working-directory: fo
        run: |
          fpm install --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Compare changed sources with the base revision. This prevents new
      # formatting regressions without making every feature PR inherit the
      # existing whole-tree formatter debt. *.inc fragments remain excluded.
      - name: Check changed-file formatting
        working-directory: ffc
        run: scripts/check_changed_format.sh

      - name: Test the nightly triage logic
        working-directory: ffc
        run: python3 scripts/test_nightly_triage.py
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
