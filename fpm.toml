name = "ffc"
version = "0.1.0"
description = "Lazy Fortran compiler using FortFront and LIRIC"
author = "krystophny"
license = "MIT"

[dependencies]
fortfront = { path = "../fortfront" }

[build]
auto-examples = false
link = ["liric", "stdc++", "m", "dl", "pthread"]

[fortran]
implicit-external = false
implicit-typing = false
source-form = "free"

[extra.fo]
dispatcher = "test_ffc_suite"
# The conformance gauntlet smoke case runs bounded corpus walks in parallel;
# its measured critical path is about 149 seconds. Keep the 10-second CPU
# budget for ordinary tests while allowing this project's I/O-bound tests
# enough wall time to finish.
test-wall-timeout = 240
# The default build profile emits no DWARF. 503 test executables carried
# 0.74 GB of `.debug_*` sections no test run ever read; `fo test --debug`
# and `fo test --asan` still get full `-g -fcheck=all -fbacktrace`.
debug-info = "g0"
pic = "true"
link = "shared"

# Gremlin's private execution views materialize project files named here.
# These runtime files are consumed by the CMake/runtime tests, not by FPM's
# source scanner.
[[extra.fo.inputs]]
path = "runtime/CMakeLists.txt"
role = "runtime-fixture"

[[extra.fo.inputs]]
path = "runtime/ffc_runtime.c"
role = "runtime-fixture"

# The full corpus case reads these directories from the FortFront path
# dependency. Gremlin materializes dependency-root fixtures under .fo-inputs.
[[extra.fo.inputs]]
root = "dependency:fortfront"
path = "examples/f90"
kind = "directory"
role = "test-fixture"

[[extra.fo.inputs]]
root = "dependency:fortfront"
path = "examples/lf"
kind = "directory"
role = "test-fixture"

# The conformance observation test runs these scripts in private views and
# records the actual FFC source, runtime ABI, and oracle inputs in receipts.

